<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الخدمات المنزلية - دليل الحرفيين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #444;
            border-right: 4px solid #007bff;
            padding-right: 10px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .artisans-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .artisan-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .artisan-info h4 {
            font-size: 16px;
            color: #222;
            margin-bottom: 3px;
        }
        .artisan-info p {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        .btn-call {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }
        .btn-call:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ منصة الحرفيين والخدمات</h1>
        <p>اطلب حرفياً أو سجل كحرفي لتقديم خدماتك</p>
    </header>

    <div class="container">
        
        <!-- قسم تسجيل حرفي جديد -->
        <div class="card">
            <h2 class="section-title">هل أنت حرفي؟ انضم إلينا</h2>
            <form id="artisanForm">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="name" required placeholder="مثال: محمد الصادق">
                </div>
                <div class="form-group">
                    <label>اختصاص المهنة</label>
                    <select id="category">
                        <option value="سباك">سباك</option>
                        <option value="كهربائي">كهربائي</option>
                        <option value="نجار">نجار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="phone" required placeholder="+216 ...">
                </div>
                <button type="submit" class="btn-submit">تسجيل الحرفي</button>
            </form>
        </div>

        <!-- قسم عرض الحرفيين من Firebase -->
        <h2 class="section-title">الحرفيون المسجلون</h2>
        <div class="artisans-list" id="artisansContainer">
            <p style="text-align:center; color:#888;">جاري تحميل الحرفيين...</p>
        </div>
    </div>

    <!-- ربط فايربيس عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDGCsBbBxpQb-NSe0j4NYs7xLLQB3PKxAQ",
            authDomain: "khadamat-app-17da5.firebaseapp.com",
            projectId: "khadamat-app-17da5",
            storageBucket: "khadamat-app-17da5.firebasestorage.app",
            messagingSenderId: "629609591825",
            appId: "1:629609591825:web:531395ee84debd0c2d2db0",
            measurementId: "G-2BKYRRGSV3"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('artisanForm');
        const container = document.getElementById('artisansContainer');

        // حفظ الحرفي في قاعدة البيانات عند الضغط على زر التسجيل
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const phone = document.getElementById('phone').value;

            try {
                await addDoc(collection(db, "artisans"), {
                    name: name,
                    category: category,
                    phone: phone,
                    createdAt: new Date()
                });
                alert('تم تسجيل الحرفي بنجاح!');
                form.reset();
                loadArtisans();
            } catch (error) {
                console.error("خطأ في الإضافة: ", error);
                alert('حدث خطأ أثناء التسجيل.');
            }
        });

        // جلب وعرض الحرفيين من قاعدة البيانات
        async function loadArtisans() {
            container.innerHTML = '<p style="text-align:center; color:#888;">جاري التحديث...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "artisans"));
                container.innerHTML = '';
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">لا يوجد حرفيون مسجلون حالياً.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const artisan = doc.data();
                    const card = document.createElement('div');
                    card.className = 'artisan-card';
                    card.innerHTML = `
                        <div class="artisan-info">
                            <h4>${artisan.name} (${artisan.category})</h4>
                            <p class="rating">⭐ جديد</p>
                        </div>
                        <a href="tel:${artisan.phone}" class="btn-call">اتصل (${artisan.phone})</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                container.innerHTML = '<p style="text-align:center; color:red;">تعذر تحميل بيانات الحرفيين.</p>';
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        loadArtisans();
    </script>
</body>
</html>
